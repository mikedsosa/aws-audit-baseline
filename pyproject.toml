[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-baseline-evidence"
version = "0.1.0"
description = "Assess one scoped Terraform plan JSON file against a small AWS private-data and audit-log baseline. Not a compliance certification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Draft author" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
aws-baseline-evidence = "aws_baseline_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
